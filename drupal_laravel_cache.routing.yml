drupalLaravelCache.clearall:
  path: '/cache/clearall'
  defaults:
    _controller: '\Drupal\drupal_laravel_cache\Controller\DrupalLaravelCacheController::clearAll'
    _title: 'Cache cleared'
  requirements:
    _permission: 'access content'

drupalLaravelCache.includes:
  path: '/gateway/includes'
  defaults:
    _controller: '\Drupal\drupal_laravel_cache\Controller\GatewayIncludesController::list'
  requirements:
    _access: 'TRUE'
  methods: [GET]
